# Local dev reverse proxy (optional). Production uses Render/Netlify directly.
# Only needed if you want backend + frontend behind one origin on localhost.
server {
    listen 80;

    location / {
        proxy_pass http://host.docker.internal:5173;   # Vite dev server
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /ws/ {
        proxy_pass http://host.docker.internal:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}